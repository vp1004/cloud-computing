<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Storage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>☁ Chotu Bhau</h1>
        <p>Simple Cloud Computing Web Application</p>
    </header>

    <main class="container">

        <!-- Storage Information -->
        <section class="storage-card">
            <h2>Storage Usage</h2>

            <div class="storage-bar">
                <div id="storageUsed"></div>
            </div>

            <p id="storageText">0 MB of 5 GB used</p>
        </section>

        <!-- Upload Section -->
        <section class="upload-card">
            <h2>Upload File</h2>

            <input type="file" id="fileInput">

            <button onclick="uploadFile()">
                Upload File
            </button>

            <p id="message"></p>
        </section>

        <!-- Files -->
        <section class="files-card">
            <h2>My Files</h2>

            <table>
                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>Size</th>
                        <th>Type</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="fileList">
                    <tr>
                        <td colspan="4">No files uploaded</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <footer>
        <p>© 2026 Cloud Storage Application</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
